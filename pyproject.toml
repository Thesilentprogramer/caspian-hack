[project]
name = "privacy-guard"
version = "0.1.0"
description = "Local sanitize/restore redaction layer for Caspian agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "caspian-sdk>=0.6.4",
    "cryptography>=44.0.0",
    "mcp>=1.12,<2",
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "spacy>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.112.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "time-machine>=2.16.0",
]

[project.scripts]
privacy-guard-agent = "privacy_guard_agent.handler:main"
privacy-guard-mcp = "privacy_guard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "ner: tests that load spaCy en_core_web_sm",
    "live: tests that hit live Slack, Email, or Featherless",
]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["privacy_guard", "privacy_guard_agent", "privacy_guard_mcp"]
omit = ["*/__main__.py"]
